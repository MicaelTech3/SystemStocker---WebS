<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <title>SystemStock User</title>
    <style>
        :root {
            --bg: #0A0A0A;
            --surface: #141414;
            --accent: #F5A623;
        
            --accent-hover: #E85D04;
            --text: #F0F0F0;
            --text-dim: #777777;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .ambient-video {
            position: absolute;
            width: 700px;
            height: 700px;
            object-fit: cover;
            border-radius: 50%;
            filter: blur(120px) opacity(0.25);
            pointer-events: none;
            z-index: 1;
            animation: floatAmbient 22s ease-in-out infinite;
        }

        @keyframes floatAmbient {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(80px, -60px) scale(1.1); }
        }

        .container {
            max-width: 450px;
            padding: 40px;
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            border: 1px solid rgba(42, 42, 42, 0.5);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            margin: 20px;
            position: relative;
            z-index: 2;
        }

        .logo img {
            max-width: 100px;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(245, 166, 35, 0.2));
        }

        h1 {
            color: var(--accent);
            font-size: 2.2rem;
            margin: 0;
            letter-spacing: 3px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 15px 0 25px 0;
        }

        .btn-download {
            display: inline-block;
            background-color: var(--accent);
            color: #000;
            padding: 20px 50px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(245, 166, 35, 0.2);
            text-transform: uppercase;
        }

        .btn-download:hover {
            background-color: var(--accent-hover);
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(232, 93, 4, 0.4);
        }

        .info-box {
            margin-top: 30px;
            font-size: 0.85rem;
            color: var(--text-dim);
            border-top: 1px solid #2A2A2A;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <video class="ambient-video" src="s.mp4" autoplay loop muted playsinline style="top: -15%; left: -15%;"></video>
    <video class="ambient-video" src="s.mp4" autoplay loop muted playsinline style="bottom: -15%; right: -15%; animation-delay: -10s; width: 600px; height: 600px;"></video>

    <div class="container">
        <div class="logo">
            <img src="logo.png" alt="Logo SystemStock">
        </div>
        
        <h1>System Stock</h1>
        <p class="subtitle">Clique no botão abaixo para baixar o instalador oficial do aplicativo de gestão SystemStock-Requisição.</p>

        <a href="SystemStock User.apk" class="btn-download">
            BAIXA AQUI
        </a>

        <div class="info-box">
            Versão: 1.0.0 | Formato: .APK<br>
            Compatível com Android 8.0 ou superior.
        </div>
    </div>

</body>
</html>
